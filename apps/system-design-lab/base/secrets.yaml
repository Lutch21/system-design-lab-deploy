# How the API key gets from Vault into the tutor, without the key ever being in Git:
#
#   ExternalSecret (this file)  "make a Secret called tutor-secrets from Vault path
#                                system-design-lab/tutor, field ANTHROPIC_API_KEY"
#        │ uses
#   SecretStore "vault"         where Vault is and how to sign in (environment-specific, so it
#                                lives in the overlay)
#        │ signs in as
#   ServiceAccount vault-reader Vault checks this account's token with Kubernetes and, if the
#                                name and namespace match its role, issues a read-only Vault token

# The identity External Secrets uses to sign in to Vault. Nothing else uses it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
---
# Vault checks a service-account token by sending it to the Kubernetes TokenReview API. With no
# separate reviewer token configured, it uses the token it was given, so that account needs
# permission to call TokenReview. system:auth-delegator is the built-in role for exactly that.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system-design-lab-vault-reader-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-reader
    namespace: system-design-lab
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tutor-secrets
  annotations:
    # On a fresh cluster ESO's CRDs may not exist yet; don't fail the whole sync over it.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h # a key rotated in Vault reaches the Secret within an hour
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: tutor-secrets # the Kubernetes Secret ESO creates and owns
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: system-design-lab/tutor # i.e. secret/data/system-design-lab/tutor in Vault
        property: ANTHROPIC_API_KEY
