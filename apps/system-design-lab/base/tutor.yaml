# tutor: the Node API that calls Claude. Its API key comes from the tutor-secrets Secret,
# which External Secrets creates from Vault (see secrets.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tutor
  labels:
    app: tutor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tutor
  template:
    metadata:
      labels:
        app: tutor
    spec:
      # The tutor doesn't call the Kubernetes API or Vault itself, so it gets no token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the "node" user in the image
      containers:
        - name: tutor
          image: ghcr.io/lutch21/system-design-lab-tutor # tag set in the overlay
          ports:
            - containerPort: 8787
          env:
            - name: TUTOR_PORT
              value: "8787"
            # Read once at startup. After the key changes, restart the pods:
            #   kubectl -n system-design-lab rollout restart deploy/tutor
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tutor-secrets
                  key: ANTHROPIC_API_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8787
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8787
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tutor # web's Nginx forwards /api to http://tutor:8787
spec:
  selector:
    app: tutor
  ports:
    - port: 8787
      targetPort: 8787
