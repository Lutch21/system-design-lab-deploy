# Where Vault is for the local kind cluster: the Vault container from the system-design-lab
# repo (docker-compose.yml), reachable by name because it's attached to the "kind" Docker network.
# In AWS this file would point at a real Vault (with TLS) or switch to AWS Secrets Manager;
# the ExternalSecret in base wouldn't change.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: http://system-design-lab-vault:8200
      path: secret # the KV mount
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes # Vault's Kubernetes auth method (set up by bootstrap/)
          role: system-design-lab
          serviceAccountRef:
            name: vault-reader
            # Two audiences, for two checks:
            #  - "vault": the Vault role only accepts tokens meant for Vault.
            #  - the API server's own audience: Vault (with no reviewer token configured) sends
            #    this same token to the Kubernetes TokenReview API as its credential, and the API
            #    server rejects tokens that weren't issued for it. Without this, login fails
            #    with "permission denied".
            audiences:
              - vault
              - https://kubernetes.default.svc.cluster.local
