# The local kind cluster: base + where Vault is + which image versions to run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-design-lab
resources:
  - ../../base
  - secret-store.yaml

# CI in the system-design-lab repo rewrites these tags after every successful build on main.
# Changing a tag here (or reverting CI's commit) is how you deploy or roll back.
images:
  - name: ghcr.io/lutch21/system-design-lab-web
    newTag: 44c3a17737814f00cdd62b993d07effc612c05d8
  - name: ghcr.io/lutch21/system-design-lab-tutor
    newTag: 44c3a17737814f00cdd62b993d07effc612c05d8
