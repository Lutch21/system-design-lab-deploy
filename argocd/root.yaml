# The "app of apps". This is the only file you apply by hand:
#
#   kubectl apply -f argocd/root.yaml
#
# Argo CD then manages every Application in argocd/apps/. To add or remove something from the
# cluster, add or remove a file there and push. No more kubectl apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lutch21/system-design-lab-deploy.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
