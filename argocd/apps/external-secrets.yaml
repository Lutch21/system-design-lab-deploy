# External Secrets Operator (ESO), installed from its official Helm chart.
#
# ESO reads secrets from an outside store (here Vault) and writes them into ordinary Kubernetes
# Secrets, then checks the store again on a schedule so a rotated value reaches the cluster.
# Argo CD renders Helm charts itself, so Helm doesn't have to be installed locally.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0 # pinned; upgrade by changing this line in a commit
    helm:
      valuesObject:
        installCRDs: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's CRDs are too large for a normal `kubectl apply`; server-side apply handles them.
      - ServerSideApply=true
